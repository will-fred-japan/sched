<!-- File: templates/index.html -->
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="theme-color" content="#121212">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <title>スケジュール一覧</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231b4d3e'/><text x='50%' y='65%' font-size='60' text-anchor='middle' fill='white'>📅</text></svg>">
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #121212; color: #e0e0e0; margin: 0; padding: 24px; font-size: 16px; }
        .container { max-width: 750px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 12px; margin-bottom: 16px; gap: 12px; }
        h1 { font-size: 22px; margin: 0; }
        .nav-group { display: flex; align-items: center; gap: 8px; }
        .nav-btn { background: #2a2a2a; color: #fff; text-decoration: none; padding: 6px 12px; border-radius: 4px; font-size: 13px; border: 1px solid #444; }
        .nav-btn:hover { background: #3a3a3a; }
        .current-month { font-weight: bold; font-size: 16px; color: #4dabf7; margin: 0 6px; }
        .subtitle { font-size: 13px; color: #888; margin-bottom: 20px; }
        .card { border: 1px solid #3b3b3b; border-radius: 6px; padding: 14px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
        .card-even { background: #181818; }
        .card-odd { background: #2d333b; }
        .info { flex: 1; }
        .info strong { color: #fff; font-size: 16px; line-height: 1.4; display: block; }
        .details { font-size: 14px; color: #aaa; margin-top: 4px; line-height: 1.4; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; background: #1b4d3e; color: #81c784; white-space: nowrap; flex-shrink: 0; }
        .badge-music { background: #4a2545; color: #f08c00; }

        @media (max-width: 600px) {
            body { padding: 14px; font-size: 17px; }
            .header { flex-direction: column; align-items: flex-start; }
            h1 { font-size: 24px; }
            .nav-btn { padding: 8px 14px; font-size: 15px; }
            .current-month { font-size: 17px; }
            .card { padding: 16px; align-items: flex-start; }
            .info strong { font-size: 17px; }
            .details { font-size: 15px; margin-top: 6px; }
            .badge { font-size: 13px; padding: 5px 9px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>スケジュール一覧</h1>
            <div class="nav-group">
                <a href="/?month={{ nav.prev }}" class="nav-btn">&laquo; 前月</a>
                <span class="current-month">{{ nav.display }}</span>
                <a href="/?month={{ nav.next }}" class="nav-btn">翌月 &raquo;</a>
            </div>
        </div>
        <div class="subtitle">最終更新: {{ now }}</div>
        {% for event in events %}
        <div class="card {% if event.day_idx % 2 == 0 %}card-even{% else %}card-odd{% endif %}">
            <div class="info">
                <strong>[{{ event.entity }}] {{ event.title }}</strong>
                <div class="details">{{ event.date }} &bull; {{ event.venue }}</div>
            </div>
            <span class="badge {% if event.category == '音楽' %}badge-music{% endif %}">{{ event.category }}</span>
        </div>
        {% else %}
        <p style="color: #ff6b6b;">{{ nav.display }}の予定は見つかりませんでした。</p>
        {% endfor %}
    </div>
	<script>
	        if ("serviceWorker" in navigator) {
	            window.addEventListener("load", () => {
	                navigator.serviceWorker.register("/sw.js").catch((err) => {
	                    console.error("SW registration failed:", err);
	                });
	            });
	        }

            // Prefetch logic for ±6 months
            document.addEventListener("DOMContentLoaded", () => {
                const currentMonthStr = "{{ nav.curr }}";
                if (!currentMonthStr || currentMonthStr.length !== 6) return;

                const year = parseInt(currentMonthStr.substring(0, 4));
                const month = parseInt(currentMonthStr.substring(4, 6));
                
                // Generate list of months to prefetch (nearest first)
                const monthsToFetch = [];
                for (let i = 1; i <= 3; i++) {
                    // Next months
                    let dNext = new Date(year, month - 1 + i, 1);
                    monthsToFetch.push(dNext.getFullYear().toString() + (dNext.getMonth() + 1).toString().padStart(2, '0'));
                    
                    // Prev months
                    let dPrev = new Date(year, month - 1 - i, 1);
                    monthsToFetch.push(dPrev.getFullYear().toString() + (dPrev.getMonth() + 1).toString().padStart(2, '0'));
                }

                // Fetch sequentially with small delay to avoid hitting rate limits or timeouts
                const fetchMonth = async (ym) => {
                    try {
                        await fetch(`/api/prefetch?month=${ym}`);
                    } catch (e) {
                        // Silent fail for prefetch
                    }
                };

                // Start prefetching after main content is loaded
                setTimeout(async () => {
                    for (const ym of monthsToFetch) {
                        await fetchMonth(ym);
                        // Small delay between requests to be polite to server/APIs
                        await new Promise(r => setTimeout(r, 200)); 
                    }
                }, 1000);
            });
	</script>
</body>
</html>
